<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1212">
<title>163音乐Pro · 传歌到手表</title>
<style>
/* ============================================================
   主题变量：#39c5bb（初音绿）占位，后续由主题系统覆盖。
   页面所有颜色都走这里，换主题只改变量。
   ============================================================ */
:root{
  --accent:#39c5bb;
  --accent-bright:#5fe3d8;
  --accent-dim:rgba(57,197,187,.12);
  --accent-edge:rgba(57,197,187,.34);

  --bg:#0b1111;
  --panel:#131b1b;
  --panel-2:#192323;
  --stroke:#223030;

  --fg:#e9f4f2;
  --fg-dim:#8ba09e;
  --bad:#ff7b72;
  --good:#39c5bb;

  --r-xl:18px;
  --r-lg:14px;
  --r-md:10px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--fg);
  background:
    radial-gradient(900px 500px at 78% -14%, rgba(57,197,187,.10), transparent 62%),
    radial-gradient(700px 380px at -8% 108%, rgba(57,197,187,.06), transparent 64%),
    var(--bg);
  font:14px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;justify-content:center;
  padding:16px;
}
.app{width:100%;max-width:760px;display:flex;flex-direction:column;min-height:100%}

/* ---------- 顶部工具栏 ---------- */
.bar{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;margin-bottom:12px;
  background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r-xl);
}
.mark{
  width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),var(--accent-bright));
  color:#04211f;font-weight:800;font-size:16px;
  box-shadow:0 5px 16px rgba(57,197,187,.26);
}
.who{min-width:0;flex:1}
.who b{display:block;font-size:15px;font-weight:700;letter-spacing:.2px}
.who span{display:block;color:var(--fg-dim);font-size:12px;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dot{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--accent)}
.dot i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:beat 2s infinite}
.dot.off{color:var(--bad)}
.dot.off i{background:var(--bad);animation:none}
@keyframes beat{
  0%{box-shadow:0 0 0 0 rgba(57,197,187,.5)}
  70%{box-shadow:0 0 0 8px rgba(57,197,187,0)}
  100%{box-shadow:0 0 0 0 rgba(57,197,187,0)}
}

.icon-btn{
  width:36px;height:36px;flex:none;border-radius:11px;cursor:pointer;
  background:var(--accent-dim);border:1px solid var(--accent-edge);
  color:var(--accent);display:grid;place-items:center;
  transition:background .15s,transform .1s;
}
.icon-btn:hover{background:rgba(57,197,187,.2)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- 拖放主区 ---------- */
.stage{
  flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;
}
.dropzone{
  position:relative;flex:1;min-height:180px;
  display:grid;place-items:center;text-align:center;
  border:1.6px dashed var(--accent-edge);border-radius:var(--r-xl);
  background:
    radial-gradient(520px 220px at 50% 0%, var(--accent-dim), transparent 72%),
    var(--panel);
  cursor:pointer;padding:26px 18px;
  transition:border-color .16s,background .16s,transform .12s;
}
.dropzone:hover{border-color:var(--accent)}
.dropzone.over{border-color:var(--accent-bright);background:rgba(57,197,187,.14);transform:scale(.995)}
.dropzone .glyph{
  width:56px;height:56px;margin:0 auto 12px;border-radius:16px;
  display:grid;place-items:center;
  background:var(--accent-dim);border:1px solid var(--accent-edge);color:var(--accent);
}
.dropzone .glyph svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.dropzone h3{margin:0 0 5px;font-size:15.5px;font-weight:650}
.dropzone p{margin:0;color:var(--fg-dim);font-size:12.5px}
.dropzone .cta{
  display:inline-block;margin-top:13px;padding:7px 16px;border-radius:999px;
  background:var(--accent);color:#04211f;font-size:12.5px;font-weight:750;
}
.hidden-file{display:none}

/* ---------- 队列 ---------- */
.queue{
  background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r-xl);
  padding:12px;max-height:42vh;display:flex;flex-direction:column;min-height:0;
}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.qhead b{font-size:13px;font-weight:650}
.qhead .n{color:var(--fg-dim);font-size:11.5px}
.qhead .gap{flex:1}
.qlist{list-style:none;margin:0;padding:0;overflow:auto;display:flex;flex-direction:column;gap:7px}
.qlist::-webkit-scrollbar{width:6px}
.qlist::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:99px}

.row{
  display:grid;grid-template-columns:30px 1fr 42px;gap:9px;align-items:center;
  padding:8px 10px;border-radius:var(--r-md);
  background:var(--panel-2);border:1px solid var(--stroke);
}
.row .tag{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent-dim);color:var(--accent);font-size:10px;font-weight:750;
}
.row .txt{min-width:0}
.row .nm{font-size:12.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;gap:7px;font-size:11px;color:var(--fg-dim);margin-top:2px;
  white-space:nowrap;overflow:hidden}
.row .meta .ok{color:var(--good)}
.row .meta .err{color:var(--bad)}
.row .num{font-size:11.5px;color:var(--fg-dim);text-align:right;font-variant-numeric:tabular-nums}
.row .track{grid-column:1 / -1;height:3px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.row .track > i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent-bright));transition:width .18s}
.row.ok{border-color:var(--accent-edge)}
.row.bad{border-color:rgba(255,123,114,.42)}

/* ---------- 监控面板（底部滑出） ---------- */
.sheet-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40;
  backdrop-filter:blur(2px);
}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  max-width:760px;margin:0 auto;
  background:var(--panel);border-top:1px solid var(--accent-edge);
  border-radius:20px 20px 0 0;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:84vh;overflow:auto;
  box-shadow:0 -18px 40px rgba(0,0,0,.5);
}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--stroke);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.sheet h3 .close{
  margin-left:auto;width:28px;height:28px;border-radius:8px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--stroke);color:var(--fg-dim);
  display:grid;place-items:center;font-size:15px;line-height:1;
}
.sheet h3 .close:hover{color:var(--fg)}

.now{
  display:grid;grid-template-columns:44px 1fr;gap:11px;align-items:center;
  padding:11px;border-radius:var(--r-lg);
  background:var(--panel-2);border:1px solid var(--stroke);margin-bottom:10px;
}
.now .cover{
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent-dim),transparent);
  border:1px solid var(--accent-edge);color:var(--accent);font-size:19px;
}
.now .t1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .t2{font-size:11.5px;color:var(--fg-dim);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.now .pb{height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}
.now .pb > i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent-bright));transition:width .5s linear}
.now .times{display:flex;justify-content:space-between;font-size:10.5px;
  color:var(--fg-dim);margin-top:3px;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{
  padding:10px 11px;border-radius:var(--r-md);
  background:var(--panel-2);border:1px solid var(--stroke);
}
.tile .k{font-size:11px;color:var(--fg-dim);display:flex;align-items:center;gap:5px}
.tile .v{font-size:14px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:10.5px;color:var(--fg-dim);margin-top:1px}
.tile.wide{grid-column:1 / -1}
.tile .meter{height:4px;border-radius:99px;background:rgba(255,255,255,.07);
  margin-top:7px;overflow:hidden}
.tile .meter > i{display:block;height:100%;border-radius:99px;
  background:var(--accent);transition:width .4s}

.sheet .hint{margin:11px 0 0;text-align:center;color:var(--fg-dim);font-size:11px}

@media (max-width:520px){
  body{padding:11px}
  .bar{padding:9px 10px;border-radius:var(--r-lg)}
  .dropzone{min-height:150px;border-radius:var(--r-lg)}
  .queue{border-radius:var(--r-lg);max-height:38vh}
  .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">

  <!-- 顶部工具栏 -->
  <div class="bar">
    <div class="mark">♪</div>
    <div class="who">
      <b>传歌到手表</b>
      <span id="subtitle">音乐进 Music · 歌词自动配对</span>
    </div>
    <div class="dot" id="conn"><i></i><span id="connText">在线</span></div>
    <button class="icon-btn" id="btnMonitor" title="状态监控" aria-label="状态监控">
      <svg viewBox="0 0 24 24">
        <path d="M3 13h3l2.5-6 3.5 12 3-8 2 2h4"/>
      </svg>
    </button>
  </div>

  <div class="stage">
    <!-- 拖放区 -->
    <div class="dropzone" id="dropzone">
      <div>
        <div class="glyph">
          <svg viewBox="0 0 24 24">
            <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/>
            <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
          </svg>
        </div>
        <h3>拖进来，或点一下选文件</h3>
        <p>音频 + 同名 .lrc 一起选，会自动配对</p>
        <div class="cta">选择文件</div>
      </div>
    </div>
    <input class="hidden-file" type="file" id="picker" multiple>

    <!-- 上传队列 -->
    <div class="queue">
      <div class="qhead">
        <b>待传</b>
        <span class="n" id="qcount">0 个</span>
        <span class="gap"></span>
        <button class="icon-btn" id="btnSend" title="开始上传" aria-label="开始上传" style="width:30px;height:30px;border-radius:9px">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M5 12h13"/><path d="M12 5l7 7-7 7"/></svg>
        </button>
        <button class="icon-btn" id="btnClear" title="清空" aria-label="清空" style="width:30px;height:30px;border-radius:9px">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 7h12"/><path d="M9 7V5h6v2"/><path d="M8 7l1 13h6l1-13"/></svg>
        </button>
      </div>
      <ul class="qlist" id="qlist"></ul>
    </div>
  </div>
</div>

<!-- 监控面板 -->
<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3>
    <svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">
      <path d="M3 13h3l2.5-6 3.5 12 3-8 2 2h4"/>
    </svg>
    手表状态
    <div class="close" id="btnClose">×</div>
  </h3>

  <div class="now">
    <div class="cover" id="monCover">♪</div>
    <div style="min-width:0">
      <div class="t1" id="monSong">未在播放</div>
      <div class="t2" id="monArtist">—</div>
      <div class="pb"><i id="monBar"></i></div>
      <div class="times"><span id="monPos">0:00</span><span id="monDur">0:00</span></div>
    </div>
  </div>

  <div class="grid">
    <div class="tile">
      <div class="k">状态</div>
      <div class="v" id="monState">—</div>
      <div class="sub" id="monStateSub">播放 / 暂停</div>
    </div>
    <div class="tile">
      <div class="k">音量</div>
      <div class="v" id="monVol">—</div>
      <div class="meter"><i id="monVolBar"></i></div>
    </div>
    <div class="tile">
      <div class="k">电量</div>
      <div class="v" id="monBat">—</div>
      <div class="sub" id="monBatSub">—</div>
    </div>
    <div class="tile">
      <div class="k">网络</div>
      <div class="v" id="monNet">—</div>
      <div class="sub" id="monNetSub">—</div>
    </div>
    <div class="tile">
      <div class="k">内存</div>
      <div class="v" id="monMem">—</div>
      <div class="sub" id="monMemSub">—</div>
    </div>
    <div class="tile">
      <div class="k">CPU</div>
      <div class="v" id="monCpu">—</div>
      <div class="sub" id="monCpuSub">进程占用</div>
    </div>
    <div class="tile">
      <div class="k">定时</div>
      <div class="v" id="monTimer">—</div>
      <div class="sub" id="monTimerSub">—</div>
    </div>
    <div class="tile">
      <div class="k">下载</div>
      <div class="v" id="monDl">—</div>
      <div class="sub" id="monDlSub">—</div>
    </div>
  </div>

  <p class="hint" id="monHint">每 1 秒刷新</p>
</div>

<script>
/* ============================================================
   常量 / 元素
   ============================================================ */
const AUDIO_RE = /\.(mp3|flac|m4a|aac|wav|ogg|opus|wma)$/i;
const LRC_RE = /\.lrc$/i;

const $ = id => document.getElementById(id);
const ui = {
  dropzone: $('dropzone'), picker: $('picker'), qlist: $('qlist'),
  qcount: $('qcount'), btnSend: $('btnSend'), btnClear: $('btnClear'),
  conn: $('conn'), connText: $('connText'), subtitle: $('subtitle'),
  btnMonitor: $('btnMonitor'), mask: $('mask'), sheet: $('sheet'), btnClose: $('btnClose'),
  // 监控面板元素（之前漏登记，导致 applyStatus 取不到节点、面板永远显示「—」）
  monCover: $('monCover'), monSong: $('monSong'), monArtist: $('monArtist'),
  monBar: $('monBar'), monPos: $('monPos'), monDur: $('monDur'),
  monState: $('monState'), monStateSub: $('monStateSub'),
  monVol: $('monVol'), monVolBar: $('monVolBar'),
  monBat: $('monBat'), monBatSub: $('monBatSub'),
  monNet: $('monNet'), monNetSub: $('monNetSub'),
  monMem: $('monMem'), monMemSub: $('monMemSub'),
  monCpu: $('monCpu'), monCpuSub: $('monCpuSub'),
  monTimer: $('monTimer'), monTimerSub: $('monTimerSub'),
  monDl: $('monDl'), monDlSub: $('monDlSub'), monHint: $('monHint')
};

const S = { items: [], seq: 0, busy: false, parallel: 3, sse: null, pollTimer: null };

/* ============================================================
   小工具
   ============================================================ */
function size(n){
  if (n === undefined || n === null) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}
function speed(bps){
  return bps ? size(bps) + '/s' : '';
}
function clock(ms){
  if (!ms || ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function stem(name){ return name.replace(/\.[^.]+$/, ''); }
function kind(name){
  if (LRC_RE.test(name)) return 'LRC';
  if (AUDIO_RE.test(name)) return '音频';
  return '文件';
}

/* ============================================================
   队列渲染
   ============================================================ */
function add(files){
  Array.from(files || []).forEach(f => {
    const it = {
      file: f, name: f.name, size: f.size,
      kind: kind(f.name), status: 'wait', progress: 0, bps: 0, note: '', err: ''
    };
    S.items.push(it);
    it.el = row(it);
    ui.qlist.appendChild(it.el);
    paint(it);
  });
  count();
}

function row(it){
  const li = document.createElement('li');
  li.className = 'row';
  li.innerHTML =
    '<div class="tag">' + (it.kind === 'LRC' ? 'LRC' : it.kind === '音频' ? '♪' : '·') + '</div>' +
    '<div class="txt"><div class="nm"></div><div class="meta"><span class="st"></span><span class="ex"></span></div></div>' +
    '<div class="num"></div>' +
    '<div class="track"><i></i></div>';
  li.querySelector('.nm').textContent = it.name;
  li.querySelector('.nm').title = it.name;
  return li;
}

function paint(it){
  if (!it.el) return;
  const pct = it.size ? Math.round(it.progress / it.size * 100) : 0;
  it.el.querySelector('.track > i').style.width = Math.min(100, pct) + '%';
  it.el.querySelector('.num').textContent =
    it.status === 'ok' ? '✓' : it.status === 'err' ? '×' : pct ? pct + '%' : '';

  const st = it.el.querySelector('.st');
  const ex = it.el.querySelector('.ex');
  it.el.classList.remove('ok', 'err');

  if (it.status === 'wait'){ st.textContent = '等待'; st.className = 'st'; ex.textContent = size(it.size); }
  else if (it.status === 'send'){ st.textContent = '上传中'; st.className = 'st'; ex.textContent = speed(it.bps) || size(it.progress); }
  else if (it.status === 'ok'){
    it.el.classList.add('ok');
    st.textContent = it.note || '完成'; st.className = 'st ok';
    ex.textContent = size(it.size);
  } else {
    it.el.classList.add('err');
    st.textContent = '失败 · ' + (it.err || '未知'); st.className = 'st err';
    ex.textContent = '';
  }
}

function count(){
  const pending = S.items.filter(i => i.status === 'wait' || i.status === 'err');
  ui.qcount.textContent = pending.length
    ? pending.length + ' 个待传 · ' + size(pending.reduce((s, i) => s + i.size, 0))
    : (S.items.length ? '全部完成' : '0 个');
  ui.btnSend.disabled = S.busy || !pending.length;
  ui.btnClear.disabled = S.busy || !S.items.length;
  ui.btnSend.style.opacity = ui.btnSend.disabled ? '.4' : '1';
  ui.btnClear.style.opacity = ui.btnClear.disabled ? '.4' : '1';
}

/* ============================================================
   上传
   ============================================================ */
function pairOf(lrc){
  const s = stem(lrc.name).toLowerCase();
  const hit = S.items.find(i => i.kind === '音频' && stem(i.name).toLowerCase() === s);
  return hit ? hit.name : '';
}

function send(it){
  return new Promise(done => {
    it.status = 'send'; it.progress = 0; it.bps = 0;
    paint(it); count();

    let url = '/upload?name=' + encodeURIComponent(it.name);
    if (it.kind === 'LRC'){
      const p = pairOf(it);
      if (p) url += '&pair=' + encodeURIComponent(p);
    }

    const x = new XMLHttpRequest();
    x.open('POST', url);
    let t0 = performance.now(), b0 = 0;

    x.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const now = performance.now(), dt = (now - t0) / 1000;
      if (dt > .25){ it.bps = (e.loaded - b0) / dt; t0 = now; b0 = e.loaded; }
      it.progress = e.loaded;
      paint(it);
    };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300){
        it.status = 'ok'; it.progress = it.size;
        try {
          const r = JSON.parse(x.responseText || '{}');
          if (r.type === 'lrc'){
            it.note = r.matched ? '歌词已匹配' : '歌词已暂存';
          }
        } catch(e){}
      } else {
        it.status = 'err'; it.err = 'HTTP ' + x.status;
      }
      paint(it); count(); done();
    };
    x.onerror = () => {
      it.status = 'err'; it.err = '网络错误'; paint(it); count(); done();
    };
    x.send(it.file);
  });
}

async function sendAll(){
  if (S.busy) return;
  const pending = S.items.filter(i => i.status === 'wait' || i.status === 'err');
  if (!pending.length) return;

  S.busy = true; count();
  pending.sort((a, b) => (a.kind === '音频' ? 0 : 1) - (b.kind === '音频' ? 0 : 1));

  let i = 0;
  await Promise.all(Array.from({ length: Math.min(S.parallel, pending.length) }, async () => {
    while (i < pending.length) await send(pending[i++]);
  }));

  S.busy = false; count();
  const bad = S.items.filter(x => x.status === 'err').length;
  ui.subtitle.textContent = bad ? bad + ' 个失败，可再点上传重试' : '全部上传完成';
  setTimeout(() => { ui.subtitle.textContent = '音乐进 Music · 歌词自动配对'; }, 3200);
}

/* ============================================================
   监控
   ============================================================ */
let sheetOpen = false;

function openSheet(){
  sheetOpen = true;
  ui.sheet.classList.add('on');
  ui.mask.classList.add('on');
  startMonitor();
}
function closeSheet(){
  sheetOpen = false;
  ui.sheet.classList.remove('on');
  ui.mask.classList.remove('on');
  stopMonitor();
}

function setConn(ok){
  ui.conn.classList.toggle('off', !ok);
  ui.connText.textContent = ok ? '在线' : '未响应';
}

function applyStatus(d){
  if (!d) return;
  setConn(true);

  ui.monSong.textContent = d.song || '未在播放';
  ui.monArtist.textContent = d.artist ? d.artist : '—';
  ui.monCover.textContent = d.playing ? '♪' : '⏸';

  const pos = d.positionMs || 0, dur = d.durationMs || 0;
  ui.monPos.textContent = clock(pos);
  ui.monDur.textContent = clock(dur);
  ui.monBar.style.width = dur > 0 ? Math.min(100, pos / dur * 100) + '%' : '0%';

  ui.monState.textContent = d.playing ? '播放中' : '已暂停';
  ui.monStateSub.textContent = d.playMode || '—';

  const vol = typeof d.volume === 'number' ? d.volume : -1;
  ui.monVol.textContent = vol >= 0 ? vol + '%' : '—';
  ui.monVolBar.style.width = vol >= 0 ? vol + '%' : '0%';

  ui.monBat.textContent = typeof d.battery === 'number' ? d.battery + '%' : '—';
  ui.monBatSub.textContent = d.charging ? '充电中' : (d.battery >= 0 ? '未充电' : '—');

  ui.monNet.textContent = d.network || '—';
  ui.monNetSub.textContent = d.networkDetail || '';

  // 2026-11-21：内存 / CPU（设备端 /proc 采样）
  if (ui.monMem) {
    ui.monMem.textContent = d.memUsedMb > 0 ? d.memUsedMb + ' MB' : '—';
    ui.monMemSub.textContent = d.memTotalMb > 0
      ? '堆 ' + d.memTotalMb + ' / 上限 ' + d.memMaxMb + ' MB' : '—';
  }
  if (ui.monCpu) {
    ui.monCpu.textContent = d.cpuPercent >= 0 ? d.cpuPercent + '%' : '—';
  }

  if (d.sleepTimerActive){
    ui.monTimer.textContent = clock(d.sleepTimerRemainingMs || 0);
    ui.monTimerSub.textContent = d.sleepTimerMode || '定时中';
  } else {
    ui.monTimer.textContent = '未设置';
    ui.monTimerSub.textContent = '—';
  }

  if (d.downloading > 0){
    ui.monDl.textContent = d.downloading + ' 项';
    ui.monDlSub.textContent = d.downloadName
      ? d.downloadName + (d.downloadPercent >= 0 ? ' · ' + d.downloadPercent + '%' : '')
      : '下载中';
  } else {
    ui.monDl.textContent = '空闲';
    ui.monDlSub.textContent = '—';
  }

  ui.monHint.textContent = d.ts ? ('更新于 ' + new Date(d.ts).toLocaleTimeString()) : '每 1 秒刷新';
}

async function fetchStatus(){
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    applyStatus(await r.json());
  } catch(e){
    setConn(false);
    ui.monHint.textContent = '读不到手表状态：' + e.message;
  }
}

function startMonitor(){
  fetchStatus();
  // 优先 SSE；不支持就退回 1s 轮询
  if (window.EventSource){
    try {
      stopMonitor();
      S.sse = new EventSource('/api/events');
      S.sse.onmessage = ev => {
        try { applyStatus(JSON.parse(ev.data)); } catch(e){}
      };
      S.sse.onerror = () => {
        // SSE 断了就降级轮询，不反复重连打扰用户
        if (S.sse){ S.sse.close(); S.sse = null; }
        if (!S.pollTimer) S.pollTimer = setInterval(fetchStatus, 1000);
      };
    } catch(e){
      S.pollTimer = setInterval(fetchStatus, 1000);
    }
  } else {
    S.pollTimer = setInterval(fetchStatus, 1000);
  }
}

function stopMonitor(){
  if (S.sse){ S.sse.close(); S.sse = null; }
  if (S.pollTimer){ clearInterval(S.pollTimer); S.pollTimer = null; }
}

/* ============================================================
   绑定
   ============================================================ */
ui.dropzone.addEventListener('click', () => ui.picker.click());
ui.picker.addEventListener('change', e => { add(e.target.files); ui.picker.value = ''; });

['dragenter','dragover'].forEach(ev => ui.dropzone.addEventListener(ev, e => {
  e.preventDefault(); ui.dropzone.classList.add('over');
}));
['dragleave','drop'].forEach(ev => ui.dropzone.addEventListener(ev, e => {
  e.preventDefault(); ui.dropzone.classList.remove('over');
}));
ui.dropzone.addEventListener('drop', e => {
  if (e.dataTransfer && e.dataTransfer.files) add(e.dataTransfer.files);
});

ui.btnSend.addEventListener('click', sendAll);
ui.btnClear.addEventListener('click', () => {
  if (S.busy) return;
  S.items = []; ui.qlist.innerHTML = ''; count();
});

ui.btnMonitor.addEventListener('click', openSheet);
ui.btnClose.addEventListener('click', closeSheet);
ui.mask.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA';
  // M 键：快速打开 / 关闭监控面板（在输入框里打字时不拦截）
  if (!typing && (e.key === 'm' || e.key === 'M')) {
    e.preventDefault();
    if (sheetOpen) closeSheet(); else openSheet();
    return;
  }
  if (e.key === 'Escape' && sheetOpen) closeSheet();
});

/* 打开页面先探一次连接 */
fetch('/api/status', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(() => setConn(true))
  .catch(() => setConn(false));
</script>
