plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qinghe.music163pro'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.qinghe.music163pro"
        minSdk 23
        targetSdk 27 
        versionCode 41
        versionName "20261003"
    }

    signingConfigs {
        release {
            def keystoreFile = file("${rootProject.projectDir}/release.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
        // 项目自带的统一调试签名。
        // 默认的 debug 签名取自「当前机器」的 ~/.android/debug.keystore，换一台机器就是另一把密钥，
        // 于是设备上已装的包无法被覆盖安装（INSTALL_FAILED_UPDATE_INCOMPATIBLE），只能卸载重装、
        // 丢设置与登录态。把调试密钥固定放进仓库，任何机器构建出来的 debug 包签名都一致。
        debugLocal {
            def localKeystore = file("${rootProject.projectDir}/keystore/163musicpro-debug.keystore")
            if (localKeystore.exists()) {
                storeFile localKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            // 存在统一调试签名就用它，否则回退到系统默认的 debug 签名
            if (signingConfigs.debugLocal.storeFile != null) {
                signingConfig signingConfigs.debugLocal
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'
    // ExoPlayer / Media3
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
